<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar registro</title>
</head>
<body>

    <h1>Eliminar registro</h1>

    <p>¿Estás seguro de eliminar el registro {{ registro.id }}?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Confirmar eliminación</button>
    </form>

    <a href="{% url 'listar' %}">Cancelar</a>

</body>
</html>
