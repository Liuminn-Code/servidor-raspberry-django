{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="{% static 'monitoreo/css/eliminar.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar registro</title>

    <link rel="stylesheet"
          href="{% static 'monitoreo/css/eliminar.css' %}">
</head>
<body>

    <main class="contenedor">

        <div class="icono">!</div>

        <h1>Eliminar registro</h1>

        <p>
            ¿Estás seguro de eliminar el registro
            <strong>#{{ registro.id }}</strong>?
        </p>

        <p class="advertencia">
            Esta acción no se puede deshacer.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="acciones">

                <a class="cancelar" href="{% url 'listar' %}">
                    Cancelar
                </a>

                <button type="submit">
                    Eliminar
                </button>

            </div>

        </form>

    </main>

</body>
</html>
