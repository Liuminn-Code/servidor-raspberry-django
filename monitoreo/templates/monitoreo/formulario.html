{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="{% static 'monitoreo/css/formulario.css' %}">	    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de métricas</title>

    <link rel="stylesheet"
          href="{% static 'monitoreo/css/formulario.css' %}">
</head>
<body>

    <main class="contenedor">

        {% if form.instance.pk %}
            <h1>Editar registro</h1>
        {% else %}
            <h1>Registrar métricas</h1>
        {% endif %}

        <p class="descripcion">
            Ingresa los datos del sistema.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Guardar registro
            </button>

        </form>

        <a class="volver" href="{% url 'listar' %}">
            Volver al listado
        </a>

    </main>

</body>
</html>
